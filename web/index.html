<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Claude usage for humans</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#0e1016">
<script>
  // apply the remembered theme before first paint so there is no flash
  (() => {
    let t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('cuh-theme') || 'system';
    if (!['system', 'light', 'dark'].includes(t)) t = 'system';
    const r = document.documentElement;
    if (t === 'light' || t === 'dark') r.dataset.theme = t;
    if (t === 'system' && matchMedia('(prefers-color-scheme: light)').matches) r.classList.add('system-light');
  })();
</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e1016; --surface: #161923; --surface-2: #1c2030; --hair: #262b3a; --track: #232838;
    --ink: #e8eaf1; --ink-2: #a3a9bb; --ink-3: #6c7284;
    --brand: #e8956b; --time: #8a90a3;
    /* status palette, validated against the dark surface */
    --good: #2ea043; --track-c: #388bfd; --warn: #bd8419; --crit: #da3633; --none: #6c7284;
    --glow: 22%;
    --vc: var(--none);
    --sans: "Inter", "SF Pro Text", "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  /* light theme: chosen when the switch says light, or when it says system and the OS is light */
  :root[data-theme="light"], :root:not([data-theme="dark"]).system-light {
    color-scheme: light;
    --bg: #f4f5f8; --surface: #ffffff; --surface-2: #ffffff; --hair: #e2e4eb; --track: #e8eaf0;
    --ink: #1b1f2a; --ink-2: #4b5163; --ink-3: #7b8194;
    --brand: #d9743f; --time: #6b7186;
    /* status palette, validated against the light surface */
    --good: #1a7f37; --track-c: #0969da; --warn: #a87a00; --crit: #b3135f; --none: #7b8194;
    --glow: 14%;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased; padding: 28px 20px 40px;
    background-image:
      radial-gradient(900px 420px at 50% -120px, color-mix(in oklab, var(--vc) var(--glow), transparent), transparent 70%);
  }
  .wrap { max-width: 1040px; margin: 0 auto; }

  /* header */
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 4px 4px 22px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -.01em; }
  .brand .star { color: var(--brand); font-size: 20px; line-height: 1; }
  .pill { font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--ink-2);
    border: 1px solid var(--hair); border-radius: 999px; padding: 3px 10px; }
  .right { display: flex; align-items: center; gap: 14px; color: var(--ink-3); font-size: 13px; font-variant-numeric: tabular-nums; }
  .ibtn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--hair); background: var(--surface); color: var(--ink-2);
    display: inline-grid; place-items: center; cursor: pointer; padding: 0; transition: color .15s, border-color .15s, transform .15s; }
  .ibtn:hover { color: var(--ink); border-color: var(--ink-3); }
  .ibtn:active { transform: scale(.94); }
  .ibtn svg { width: 18px; height: 18px; }
  .theme svg { display: none; }
  .theme[data-mode="system"] .i-system, .theme[data-mode="light"] .i-light, .theme[data-mode="dark"] .i-dark { display: block; }

  /* settings */
  .settings { background: var(--surface); color: var(--ink); border: 1px solid var(--hair); border-radius: 18px; padding: 24px 24px 20px;
    width: min(440px, calc(100vw - 32px)); box-shadow: 0 24px 60px rgb(0 0 0 / .35); }
  .settings::backdrop { background: rgb(0 0 0 / .45); backdrop-filter: blur(2px); }
  .settings h2 { margin: 0 0 18px; font-size: 18px; font-weight: 650; letter-spacing: -.01em; }
  .settings label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .settings .hint { margin: 0 0 10px; color: var(--ink-3); font-size: 13px; line-height: 1.45; }
  .settings .hint code { font-size: 12px; background: var(--track); padding: 1px 5px; border-radius: 5px; }
  .settings .row { display: flex; gap: 8px; }
  .settings input { font: inherit; flex: 1; min-width: 0; background: var(--bg); color: var(--ink); border: 1px solid var(--hair); border-radius: 10px; padding: 9px 12px; }
  .settings input:focus { outline: 2px solid color-mix(in oklab, var(--brand) 60%, transparent); outline-offset: 1px; }
  .settings button { font: inherit; font-size: 14px; font-weight: 600; background: var(--surface-2); color: var(--ink); border: 1px solid var(--hair); border-radius: 10px; padding: 8px 14px; cursor: pointer; }
  .settings button:hover { border-color: var(--ink-3); }
  .settings button:disabled { opacity: .5; cursor: default; }
  .settings button.primary { background: var(--ink); color: var(--bg); border-color: transparent; }
  .settings .result { min-height: 22px; margin: 10px 0 4px; font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
  .settings .result i { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--none); }
  .settings .result.ok { color: var(--good); } .settings .result.ok i { background: var(--good); }
  .settings .result.bad { color: var(--crit); } .settings .result.bad i { background: var(--crit); }
  .settings .actions { display: flex; gap: 8px; margin-top: 14px; }
  .settings .actions .spacer { flex: 1; }
  .settings .meta { margin: 18px 0 0; padding-top: 12px; border-top: 1px solid var(--hair); color: var(--ink-3); font-size: 12.5px; }

  /* hero */
  .hero { text-align: center; padding: 36px 16px 40px; }
  .hero .word { display: inline-flex; align-items: center; gap: 14px; font-size: 52px; font-weight: 650; letter-spacing: -.02em; line-height: 1.05; color: var(--vc); }
  .hero .word .e { font-size: 40px; line-height: 1; }
  .hero p { margin: 14px auto 0; max-width: 640px; font-size: 18px; color: var(--ink); line-height: 1.5; }
  .hero .note { margin-top: 10px; font-size: 13px; color: var(--ink-3); }

  /* limits */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .card { position: relative; background: var(--surface); border: 1px solid var(--hair); border-radius: 18px; padding: 20px 20px 18px;
    outline: none; transition: border-color .2s, transform .2s; }
  .card:hover, .card:focus-visible { border-color: color-mix(in oklab, var(--vc) 55%, var(--hair)); transform: translateY(-1px); }
  .card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .card .name { font-weight: 650; font-size: 16px; letter-spacing: -.01em; }
  .card .reset { color: var(--ink-3); font-size: 13px; font-variant-numeric: tabular-nums; }
  .ring { display: block; width: 190px; height: 190px; margin: 14px auto 6px; }
  .ring .trk { fill: none; stroke-linecap: butt; }
  .center { text-align: center; margin-top: -132px; height: 126px; pointer-events: none; }
  .center .pct { font-size: 34px; font-weight: 650; letter-spacing: -.02em; line-height: 1; }
  .center .lbl { font-size: 12px; color: var(--ink-3); margin-top: 4px; letter-spacing: .04em; text-transform: uppercase; }
  .judge { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px; font-size: 15px; }
  .judge i { width: 9px; height: 9px; border-radius: 50%; background: var(--vc); flex: none; }
  .judge.strong { font-weight: 650; }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--hair); font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .legend span { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .legend i { width: 14px; height: 4px; border-radius: 2px; display: inline-block; }
  .legend .t i { background: var(--time); } .legend .q i { background: var(--vc); } .legend .p { color: var(--ink-3); }
  .legend b { font-weight: 600; color: var(--ink); }
  .pace { display: flex; justify-content: center; gap: 8px; margin-top: 8px; font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .pace b { font-weight: 600; color: var(--ink-2); }

  /* extra usage */
  .extra { margin-top: 16px; background: var(--surface); border: 1px solid var(--hair); border-radius: 14px; padding: 14px 20px; display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; }
  .extra .k { font-size: 12px; letter-spacing: .06em; color: var(--ink-3); text-transform: uppercase; font-weight: 600; }
  .extra .bar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .extra .bar i { display: block; height: 100%; background: var(--ink-2); border-radius: 3px; }
  .extra .v { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 14px; }

  /* footer, table */
  footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-top: 18px; padding: 0 4px; color: var(--ink-3); font-size: 13px; }
  .error { margin-top: 14px; color: #f0a0a0; font-size: 13px; text-align: center; }
  .banner { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; margin: 6px 0 22px;
    background: color-mix(in oklab, var(--warn) 14%, var(--surface)); border: 1px solid color-mix(in oklab, var(--warn) 50%, var(--hair));
    border-radius: 14px; padding: 14px 18px; }
  .banner .ic { font-size: 22px; line-height: 1.2; }
  .banner b { display: block; font-weight: 650; margin-bottom: 2px; }
  .banner p { margin: 0; color: var(--ink-2); font-size: 14px; }

  /* gate */
  .gate { max-width: 380px; margin: 60px auto; text-align: center; background: var(--surface); border: 1px solid var(--hair); border-radius: 18px; padding: 28px; }
  .gate p { color: var(--ink-2); margin: 0 0 14px; }
  .gate input { font: inherit; width: 100%; background: var(--bg); color: var(--ink); border: 1px solid var(--hair); border-radius: 10px; padding: 10px 12px; }
  .gate button { font: inherit; margin-top: 10px; width: 100%; background: var(--ink); color: var(--bg); border: 0; border-radius: 10px; padding: 10px; font-weight: 600; cursor: pointer; }
  .gate .bad { margin: 10px 0 0; color: var(--crit); font-size: 13px; }
  .loading #view { opacity: .6; transition: opacity .2s; }
  [hidden] { display: none !important; }
  @media (max-width: 560px) { .hero .word { font-size: 40px; } .hero .word .e { font-size: 32px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="star">✱</span><span>Claude usage <span style="color:var(--ink-3);font-weight:500">for humans</span></span><span class="pill" id="plan" hidden></span></div>
    <div class="right">
      <span id="stamp">connecting</span>
      <button class="ibtn theme" id="themeBtn" type="button" data-mode="system" title="Theme: system" aria-label="Theme: system">
        <svg class="i-system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        <svg class="i-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="ibtn" id="settingsBtn" type="button" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="gate" id="gate" hidden>
    <p>This server asks for its shared secret.</p>
    <input id="secret" type="password" placeholder="secret" autocomplete="off">
    <button id="go">Connect</button>
    <p class="bad" id="gateMsg" hidden></p>
  </div>

  <dialog class="settings" id="settings" aria-labelledby="settingsTitle">
    <form method="dialog" id="settingsForm">
      <h2 id="settingsTitle">Settings</h2>
      <label for="secretIn">Shared secret</label>
      <p class="hint">The value of <code>CUH_SECRET</code> the server was started with. It is kept in this browser only; to change what the server expects, edit <code>.env</code> and restart it.</p>
      <div class="row">
        <input id="secretIn" type="password" autocomplete="off" spellcheck="false" placeholder="secret">
        <button type="button" id="reveal" aria-pressed="false">Show</button>
      </div>
      <div class="result" id="testResult" aria-live="polite"><i></i><span>Not tested yet.</span></div>
      <div class="actions">
        <button type="button" id="test">Test</button>
        <span class="spacer"></span>
        <button type="button" id="cancel">Cancel</button>
        <button type="submit" id="save" class="primary">Save</button>
      </div>
      <p class="meta" id="settingsMeta"></p>
    </form>
  </dialog>

  <main id="view" hidden>
    <div class="banner" id="banner" hidden><span class="ic">⚠️</span><div><b id="bannerTitle"></b><p id="bannerText"></p></div></div>
    <section class="hero">
      <div class="word"><span class="e" id="emoji"></span><span id="word"></span></div>
      <p id="headline"></p>
      <div class="note" id="usual" hidden></div>
    </section>
    <section class="grid" id="grid"></section>
    <section class="extra" id="extra" hidden>
      <span class="k">Extra usage</span>
      <div class="bar"><i id="extraBar"></i></div>
      <span class="v" id="extraText"></span>
    </section>
    <div class="error" id="error" hidden></div>
  </main>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  window.addEventListener('error', (e) => { const el = $('error'); if (el) { el.hidden = false; el.textContent = 'page error: ' + e.message; } $('view').hidden = false; $('stamp').textContent = 'error'; });
  const NS = 'http://www.w3.org/2000/svg';
  const COLOR = { use_more: 'var(--good)', on_track: 'var(--track-c)', slow_down: 'var(--warn)', running_out: 'var(--crit)',
    wait: 'var(--crit)', no_pace_yet: 'var(--none)', unknown: 'var(--none)' };
  const EMOJI = { use_more: '🟢', on_track: '🔵', slow_down: '🟡', running_out: '🔴', wait: '⏳', no_pace_yet: '⚪', unknown: '❓' };
  const WORD = { use_more: 'Use more', on_track: 'On track', slow_down: 'Slow down', running_out: 'Running out',
    wait: 'Wait', no_pace_yet: 'No pace yet', unknown: 'No data' };
  let secret = localStorage.getItem('cuh-secret') || '';
  let last = null, lastAt = 0;

  const dur = (s) => {
    s = Math.max(0, Math.round(s / 60)) * 60;
    const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
    if (d) return `${d}d ${h}h`;
    if (h) return `${h}h ${String(m).padStart(2, '0')}m`;
    return `${m}m`;
  };
  const ago = (t) => { const s = (Date.now() - t) / 1000; return s < 60 ? 'just now' : dur(s) + ' ago'; };
  const clock = (iso) => {
    const t = new Date(Math.round(new Date(iso).getTime() / 60000) * 60000), now = new Date();
    const hm = t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
    return t.toDateString() === now.toDateString() ? `resets at ${hm}` : `resets ${t.toLocaleDateString([], { weekday: 'short' })} ${hm}`;
  };
  const windowOf = (l) => l.group === 'weekly' ? 7 * 86400 : 5 * 3600;
  const position = (l) => {
    if (!l.resets_at) return 'no window';
    const el = windowOf(l) - l.resets_in_seconds;
    return l.group === 'weekly' ? `day ${Math.min(7, Math.floor(el / 86400) + 1)} of 7` : `${dur(el)} of 5h`;
  };
  const judgment = (l) => {
    if (!l.resets_at) return ['', false];
    if (l.percent >= 100) return ['used up', true];
    if (l.empty_in_seconds > 0) return ['runs out in ' + dur(l.empty_in_seconds), true];
    if (l.projected_at_reset < 0) return ['no pace yet', false];
    const base = (l.group === 'weekly' ? 'on course to end the week at ' : 'on course to end at ') + Math.round(l.projected_at_reset) + '%';
    return [l.rate_source === 'usual' ? base + ' at your usual pace' : base, false];
  };

  // ---- rings ----
  const STALE_MS = 15 * 60 * 1000;
  const R_OUT = 82, R_IN = 64, W = 11, C = 95; // radii, stroke, center
  function arc(r, from, to, color, opacity, dashed) {
    // from/to are fractions of the circle, clockwise from 12 o'clock
    const p = document.createElementNS(NS, 'circle');
    p.setAttribute('cx', C); p.setAttribute('cy', C); p.setAttribute('r', r);
    p.setAttribute('class', 'trk');
    p.setAttribute('stroke', color); p.setAttribute('stroke-width', W);
    if (opacity != null) p.setAttribute('stroke-opacity', opacity);
    const len = 2 * Math.PI * r;
    const span = Math.max(0, Math.min(1, to) - Math.max(0, from));
    p.setAttribute('transform', `rotate(-90 ${C} ${C})`);
    if (dashed) {
      // short dashes inside the span only: the dash pattern is clipped by a mask-like second circle
      const g = document.createElementNS(NS, 'g');
      const clipId = 'c' + Math.random().toString(36).slice(2, 8);
      const clip = document.createElementNS(NS, 'clipPath'); clip.setAttribute('id', clipId);
      const win = document.createElementNS(NS, 'circle');
      win.setAttribute('cx', C); win.setAttribute('cy', C); win.setAttribute('r', r);
      win.setAttribute('fill', 'none'); win.setAttribute('stroke', '#000'); win.setAttribute('stroke-width', W + 2);
      win.setAttribute('stroke-dasharray', `${span * len} ${len}`); win.setAttribute('stroke-dashoffset', -Math.max(0, from) * len);
      win.setAttribute('transform', `rotate(-90 ${C} ${C})`);
      clip.appendChild(win); g.appendChild(clip);
      p.setAttribute('stroke-dasharray', '4 5'); p.setAttribute('stroke-dashoffset', -Math.max(0, from) * len);
      p.setAttribute('clip-path', `url(#${clipId})`);
      g.appendChild(p);
      return g;
    }
    p.setAttribute('stroke-dasharray', `${span * len} ${len}`);
    p.setAttribute('stroke-dashoffset', -Math.max(0, from) * len);
    return p;
  }
  function endDot(r, frac, color) {
    const a = 2 * Math.PI * Math.min(1, frac) - Math.PI / 2;
    const d = document.createElementNS(NS, 'circle');
    d.setAttribute('cx', C + r * Math.cos(a)); d.setAttribute('cy', C + r * Math.sin(a));
    d.setAttribute('r', W / 2); d.setAttribute('fill', color);
    return d;
  }
  function ring(l, color) {
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 190 190'); svg.setAttribute('class', 'ring'); svg.setAttribute('aria-hidden', 'true');
    const elapsed = l.elapsed_fraction >= 0 ? l.elapsed_fraction : 0;
    const used = Math.min(1, l.percent / 100);
    // tracks: neutral, so "unused" never reads as a tone of the data colour
    svg.append(arc(R_OUT, 0, 1, 'var(--time)', .16), arc(R_IN, 0, 1, color, .16));
    // time (outer) and used (inner); the projection lives in the sentence, not on the ring
    if (elapsed > 0) { svg.append(arc(R_OUT, 0, elapsed, 'var(--time)')); if (elapsed < 1) svg.append(endDot(R_OUT, elapsed, 'var(--time)')); }
    if (used > 0) { svg.append(arc(R_IN, 0, used, color)); if (used < 1) svg.append(endDot(R_IN, used, color)); }
    return svg;
  }

  // ---- render ----
  const sampledAt = (d) => { const t = d.fetched_at ? new Date(d.fetched_at) : null; return t && t.getFullYear() > 2000 ? t : null; };
  function render(d) {
    const v = d.verdict || 'unknown';
    document.documentElement.style.setProperty('--vc', COLOR[v]);
    if (d.plan_label) { $('plan').textContent = d.plan_label; $('plan').hidden = false; } else $('plan').hidden = true;
    $('emoji').textContent = EMOJI[v]; $('word').textContent = WORD[v];
    $('headline').textContent = d.headline || 'Could not read your usage.';

    const grid = $('grid'); grid.replaceChildren();
    for (const l of d.limits || []) {
      const color = COLOR[l.verdict] || COLOR.unknown;
      const card = document.createElement('article');
      card.className = 'card'; card.style.setProperty('--vc', color);
      const top = document.createElement('div'); top.className = 'top';
      const name = document.createElement('span'); name.className = 'name'; name.textContent = l.name;
      const reset = document.createElement('span'); reset.className = 'reset'; reset.textContent = l.resets_at ? clock(l.resets_at) : 'no window';
      top.append(name, reset);
      const center = document.createElement('div'); center.className = 'center';
      const pct = document.createElement('div'); pct.className = 'pct'; pct.textContent = Math.round(l.percent) + '%';
      const lbl = document.createElement('div'); lbl.className = 'lbl'; lbl.textContent = 'used';
      center.append(pct, lbl);
      const [jt, strong] = judgment(l);
      const judge = document.createElement('div'); judge.className = 'judge' + (strong ? ' strong' : '');
      const dot = document.createElement('i');
      const jtxt = document.createElement('span'); jtxt.textContent = jt;
      judge.append(dot, jtxt);
      const legend = document.createElement('div'); legend.className = 'legend';
      const t = document.createElement('span'); t.className = 't'; t.append(Object.assign(document.createElement('i')), document.createTextNode('time '));
      const tb = document.createElement('b'); tb.textContent = position(l); t.appendChild(tb);
      const q = document.createElement('span'); q.className = 'q'; q.append(document.createElement('i'), document.createTextNode('used '));
      const qb = document.createElement('b'); qb.textContent = Math.round(l.percent) + '%'; q.appendChild(qb);
      legend.append(t, q);
      const pace = document.createElement('div'); pace.className = 'pace';
      const pl = document.createElement('span'); pl.textContent = 'Your pace';
      const pv = document.createElement('b');
      if (l.rate_source) {
        const perDay = l.group === 'weekly', r = l.rate_percent_per_hour;
        pv.textContent = (perDay ? (r * 24).toFixed(1) + '% a day' : r.toFixed(1) + '% an hour')
          + (r === 0 ? ' · idle' : l.rate_source === 'usual' ? ' · your usual' : l.rate_source === 'average' ? ' · so far' : '')
          + (l.vs_usual >= 1.5 || (l.vs_usual > 0 && l.vs_usual <= 0.5) ? ` · ${l.vs_usual.toFixed(1)}× usual` : '');
      } else pv.textContent = '–';
      pace.append(pl, pv);
      card.append(top, ring(l, color), center, judge, legend, pace);
      grid.appendChild(card);
    }

    const sp = d.spend;
    if (sp && sp.limit && sp.limit.amount_minor > 0) {
      const money = (m) => (m.currency === 'USD' ? '$' : m.currency + ' ') + (m.amount_minor / 10 ** m.exponent).toFixed(2);
      $('extraText').textContent = `${money(sp.used)} of ${money(sp.limit)} · ${sp.enabled ? 'on' : 'off'}`;
      $('extraBar').style.width = Math.min(100, 100 * sp.used.amount_minor / sp.limit.amount_minor) + '%';
      $('extra').hidden = false;
    } else $('extra').hidden = true;

    stamp(d);
    // numbers come from laptops running Claude Code, so a gap means no laptop
    // has sampled for a while, or none can (a login that stopped working)
    const at = sampledAt(d);
    if (!at || Date.now() - at > STALE_MS) {
      $('bannerTitle').textContent = at ? `Last sample ${ago(at)}` : 'No samples yet';
      $('bannerText').textContent = 'Samples come from computers running Claude Code with cuh in the status line. Open Claude Code on one of them; if the warning stays, check that status line for the reason.';
      $('banner').hidden = false;
    } else $('banner').hidden = true;
    $('error').hidden = !d.error; $('error').textContent = d.error ? d.error : '';
  }
  function stamp(d) {
    const at = sampledAt(d);
    $('stamp').textContent = at ? 'updated ' + ago(at) : 'no samples yet';
  }

  const authHeaders = (s) => (s ? { Authorization: 'Bearer ' + s } : {});

  async function load() {
    document.body.classList.add('loading');
    try {
      const r = await fetch('/now', { headers: authHeaders(secret), cache: 'no-store' });
      if (r.status === 401) {
        $('view').hidden = true; $('gate').hidden = false;
        // a secret that was refused deserves a word; a first visit with none stored does not
        $('gateMsg').hidden = !secret; $('gateMsg').textContent = 'That secret was rejected.';
        $('secret').focus(); return;
      }
      if (!r.ok) throw new Error('server returned HTTP ' + r.status);
      last = await r.json(); lastAt = Date.now();
      $('gate').hidden = true; $('view').hidden = false;
      render(last);
    } catch (e) {
      if (last) { render(last); $('error').hidden = false; $('error').textContent = `server unreachable: ${e.message}; showing numbers from ${ago(lastAt)}`; }
      else { $('view').hidden = false; render({ error: 'server unreachable: ' + e.message }); }
    } finally { document.body.classList.remove('loading'); }
  }

  $('go').onclick = () => { secret = $('secret').value.trim(); localStorage.setItem('cuh-secret', secret); load(); };
  $('secret').onkeydown = (e) => { if (e.key === 'Enter') $('go').onclick(); };

  // ---- settings: change the secret this browser sends, and test it against the server ----
  // check asks /ping with a candidate secret. It never touches the stored one.
  async function check(s) {
    try {
      const r = await fetch('/ping', { headers: authHeaders(s), cache: 'no-store' });
      if (r.status === 401) return { ok: false, text: s ? 'Rejected. The server expects a different secret.' : 'Rejected. This server asks for a secret.' };
      if (!r.ok) throw new Error('server returned HTTP ' + r.status);
      const p = await r.json();
      if (p.secret_required === false) return { ok: true, text: 'Accepted. This server does not ask for a secret, so any value works.' };
      return { ok: true, text: 'Accepted.' };
    } catch (e) { return { ok: false, text: 'Could not reach the server: ' + e.message }; }
  }
  // showResult paints the test line: null is the neutral "not tested" state, a string is a neutral message
  function showResult(res) {
    const el = $('testResult');
    el.className = 'result' + (res && typeof res === 'object' ? (res.ok ? ' ok' : ' bad') : '');
    el.lastElementChild.textContent = res ? (res.text || res) : 'Not tested yet.';
  }
  const dlg = $('settings'), secretIn = $('secretIn');
  function openSettings() {
    secretIn.value = secret; secretIn.type = 'password';
    $('reveal').textContent = 'Show'; $('reveal').setAttribute('aria-pressed', 'false');
    showResult(null);
    $('settingsMeta').textContent = 'Server ' + location.host + (last && last.server ? ' · cuh ' + last.server : '')
      + (secret ? ' · a secret is stored in this browser' : ' · no secret stored in this browser');
    dlg.showModal(); secretIn.focus(); secretIn.select();
  }
  $('settingsBtn').onclick = openSettings;
  $('cancel').onclick = () => dlg.close();
  $('reveal').onclick = () => {
    const show = secretIn.type === 'password';
    secretIn.type = show ? 'text' : 'password';
    $('reveal').textContent = show ? 'Hide' : 'Show'; $('reveal').setAttribute('aria-pressed', String(show));
    secretIn.focus();
  };
  secretIn.oninput = () => showResult(null); // an edited value is untested again
  $('test').onclick = async () => {
    $('test').disabled = true; showResult('Testing…');
    showResult(await check(secretIn.value.trim()));
    $('test').disabled = false;
  };
  $('settingsForm').onsubmit = () => {
    // method="dialog" closes it; we only persist and refetch
    secret = secretIn.value.trim();
    localStorage.setItem('cuh-secret', secret);
    load();
  };
  // ---- theme: system / light / dark, remembered; ?theme= overrides for app windows ----
  const mq = matchMedia('(prefers-color-scheme: light)');
  function applyTheme(t) {
    const root = document.documentElement;
    if (t === 'light' || t === 'dark') root.dataset.theme = t; else delete root.dataset.theme;
    root.classList.toggle('system-light', t === 'system' && mq.matches);
    const btn = $('themeBtn');
    btn.dataset.mode = t; btn.title = 'Theme: ' + t + ' (click to change)'; btn.setAttribute('aria-label', btn.title);
  }
  let theme = new URLSearchParams(location.search).get('theme') || localStorage.getItem('cuh-theme') || 'system';
  if (!['system', 'light', 'dark'].includes(theme)) theme = 'system';
  applyTheme(theme);
  mq.addEventListener('change', () => applyTheme(theme));
  const order = ['system', 'light', 'dark'];
  $('themeBtn').onclick = () => { theme = order[(order.indexOf(theme) + 1) % order.length]; localStorage.setItem('cuh-theme', theme); applyTheme(theme); };
  load();
  setInterval(load, 30000);
  setInterval(() => { if (last) stamp(last); }, 10000);
})();
</script>
</body>
</html>
