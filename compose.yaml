# Stores the samples your laptops post and serves the dashboard.
# Run: CUH_SECRET=<secret> [CUH_PORT=8787] docker compose up -d --build
services:
  cuh:
    build: .
    image: cuh:local
    container_name: cuh
    restart: unless-stopped
    # run as your own user so ./data stays yours
    user: "${UID:-1000}:${GID:-1000}"
    # bind mounts under SELinux (Fedora, RHEL) are otherwise unreadable to the container
    security_opt:
      - label=disable
    ports:
      - "${CUH_PORT:-8787}:8787"
    volumes:
      - ./data:/data
    environment:
      CUH_SECRET: ${CUH_SECRET:?pass CUH_SECRET=... on the command line}
