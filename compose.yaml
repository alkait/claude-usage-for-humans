# The server holds no Claude login. It stores the samples your laptops post
# and serves the dashboard. Copy .env.example to .env first.
services:
  cuh:
    build: .
    image: cuh:local
    container_name: cuh
    restart: unless-stopped
    # run as your own user so ./data stays yours
    user: "${UID:-1000}:${GID:-1000}"
    # bind mounts under SELinux (Fedora, RHEL) are otherwise unreadable to the container
    security_opt:
      - label=disable
    ports:
      - "${CUH_PORT:-8787}:8787"
    volumes:
      - ./data:/data
    environment:
      CUH_SECRET: ${CUH_SECRET:?set CUH_SECRET in .env}
